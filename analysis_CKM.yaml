likelihoods:
  - name: EXP-normalised-differential-width-tau
    constraints:
      - 'tau->K_Spinu::P(q2_min,q2_max)@Belle:2007A'
  - name: EXP-BR-tau
    constraints:
      - 'tau->K_Spinu::BR@PDG:2024A'
      - 'tau->K^-pinu::BR@PDG:2024A'
  - name: EXP-BR-Kl3
    constraints:
      - 'K^+->pi^0l^+nu::BR@KLOE:2008A'
      - 'K_S->pi^-e^+nu::BR@KLOE:2002A'
      - 'K_S->pi^-mu^+nu::BR@KLOE-2:2020A'
      # - 'K_L->pi^-l^+nu::BR@KLOE:2006A'
      # - 'K_L->pi^-l^+nu::BR@KTEV:2004A'
    manual_constraints:
      # Covariance scaled by factor 2.1^2 compared to K_L->pi^-l^+nu::BR@KLOE:2006A
      'K_L->pi^-l^+nu::BR@scaledKLOE:2006A':
        type: MultivariateGaussian(Covariance)
        observables:
            - K_L->pilnu::BR
            - K_L->pilnu::BR
        kinematics:
            - {}
            - {}
        options:
            - {l: e}
            - {l: mu}
        means: [ 0.20035, 0.1349 ]
        covariance:
            - [ 2.61e-6, -6.53e-7 ]
            - [ -6.53e-7, 2.61e-6 ]
      # Covariance scaled by factor 2.1^2 compared to K_L->pi^-l^+nu::BR@KTEV:2004A
      'K_L->pi^-l^+nu::BR@scaledKTEV:2004A':
        type: MultivariateGaussian(Covariance)
        observables:
            - K_L->pilnu::BR
            - K_L->pilnu::BR
        kinematics:
            - {}
            - {}
        options:
            - {l: e}
            - {l: mu}
        means: [ 0.20335, 0.13505 ]
        covariance:
            - [ 1.33e-6, 1.64e-7 ]
            - [ 1.64e-7, 8.93e-7 ]
  - name: EXP-BR-Kl2
    constraints:
      - 'K->munu::BR@PDG:2024A'
  - name: EXP-BR-tau-2body
    constraints:
      - 'tau->Knu::BR@PDG:2024A'
  - name: TH-Callan-Treiman
    manual_constraints:
      "0->Kpi::DeltaCT":
        type: "Gaussian"
        observable: "0->Kpi::Delta_CT@KSvD2025"
        kinematics: {}
        options: {}
        mean: -3.5e-3
        sigma-stat: {"hi": 0., "lo": 0.}
        sigma-sys:  {"hi": 8e-3, "lo": 8e-3} # See eq 2.5 in 0903.1654
      "0->Kpi::DeltaCTtilde":
        type: "Gaussian"
        observable: "0->Kpi::Delta_CTtilde@KSvD2025"
        kinematics: {}
        options: {}
        mean: 0.03
        sigma-stat: {"hi": 0., "lo": 0.}
        sigma-sys:  {"hi": 0.03, "lo": 0.03}
  - name: TH-dispersive-bound
    manual_constraints:
      "s->u::Bound[0^+]":
        type: "UniformBound"
        observables: [ "0->Kpi::Saturation_f0@KSvD2025" ]
        kinematics: [ {} ]
        options: [ {} ]
        bound: 1.0
        uncertainty: 0.2 # Potential higher order QCD error on chi_0p
      "s->u::Bound[1^-]":
        type: "UniformBound"
        observables: [ "0->Kpi::Saturation_f+@KSvD2025" ]
        kinematics: [ {} ]
        options: [ {} ]
        bound: 1.0
        uncertainty: 0.003 # Error of chi_1m
  - name: LAT-fK-fpi
    manual_constraints:
      "decay-constant::K_u@FLAG:2024":
        type: "Gaussian"
        observable: "decay-constant::K_u"
        kinematics: {}
        options: {}
        mean: 0.1557
        sigma-stat: {"hi": 0.0003, "lo": 0.0003}
        sigma-sys:  {"hi": 0., "lo": 0.}
      "decay-constant::pi@FLAG:2024":
        type: "Gaussian"
        observable: "decay-constant::pi"
        kinematics: {}
        options: {}
        mean: 0.1302
        sigma-stat: {"hi": 0.0008, "lo": 0.0008}
        sigma-sys:  {"hi": 0., "lo": 0.}
  - name: LAT-fplus0
    manual_constraints:
      "0->Kpi::f_+(0)@FLAG:2024":
        type: "Gaussian"
        observable: "0->Kpi::f_+(0)"
        kinematics: {}
        options: {}
        mean: 0.9698
        sigma-stat: {"hi": 0.0017, "lo": 0.0017}
        sigma-sys:  {"hi": 0., "lo": 0.}


priors:
  - name: Vus
    descriptions:
      - { 'parameter': 'CKM::abs(V_us)', 'min': 0.223, 'max': 0.227, 'type': 'uniform'}

  - name: FF-K892-pole-parameters
    descriptions:
      - { 'parameter': '0->Kpi::M_(+,0)@KSvD2025', 'min': 0.890, 'max': 0.893, 'type': 'uniform'}
      - { 'parameter': '0->Kpi::Gamma_(+,0)@KSvD2025', 'min': 0.043, 'max': 0.048, 'type': 'uniform'}

  - name: decay-constants
