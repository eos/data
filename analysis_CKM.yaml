observables:
  'CKM::Vus':
    latex: '|V_{us}|'
    unit: '1'
    options: {}
    expression: '[[CKM::abs(V_us)]]'
  'decay-constant::K':
    latex: 'f_{K^+}'
    unit: 'GeV'
    options: {}
    expression: '[[decay-constant::K_u]]'


predictions:
  - name: Vus-correlations
    observables:
    - name: CKM::Vus
    - name: decay-constant::K
    - name: 0->Kpi::f_+(0)


steps:
  - title: 'Sample from CKM_2_2_3_3 posterior'
    id: 'CKM_2_2_3_3.sample'
    tasks:
      - task: 'sample-nested'
        arguments:
          posterior: 'CKM_2_2_3_3'
          sampling-method: 'rwalk'
          nlive: 500
  - title: 'Produce corner plot for CKM_2_2_3_3 posterior'
    id: 'CKM_2_2_3_3.corner-plot'
    depends_on:
      - 'CKM_2_2_3_3.sample'
    tasks:
      - task: 'corner-plot'
        arguments:
          posterior: 'CKM_2_2_3_3'
  - title: 'Find mode from CKM_2_2_3_3 posterior'
    id: 'CKM_2_2_3_3.find-mode'
    depends_on:
      - 'CKM_2_2_3_3.sample'
    tasks:
      - task: 'find-mode'
        arguments:
          posterior: 'CKM_2_2_3_3'
          from-samples: true
          optimizations: 10
  - title: 'Predict observables from CKM_2_2_3_3 posterior'
    id: 'CKM_2_2_3_3.predict-observables'
    depends_on:
      - 'CKM_2_2_3_3.sample'
    tasks:
      - task: 'predict-observables'
        arguments:
          posterior: 'CKM_2_2_3_3'
          prediction: 'Vus-correlations'

