      - { 'parameter': '0->Kpi::b_0^1@KSvD2025', 'min': -0.5, 'max': 1.5, 'type': 'uniform'}
      - { 'parameter': '0->Kpi::b_0^2@KSvD2025', 'min': -1.5, 'max': 2.5, 'type': 'uniform'}
      - { 'parameter': '0->Kpi::b_0^3@KSvD2025', 'min': -1.0, 'max': 2.5, 'type': 'uniform'}
      - { 'parameter': '0->Kpi::b_0^4@KSvD2025', 'min': -0.5, 'max': 1.0, 'type': 'uniform'}
