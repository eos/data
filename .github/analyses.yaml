# Analysis files to be validated by .github/workflows/validate.yaml.
#
# One entry per data set, keyed by the data set id *without* its revision suffix. That key doubles
# as the name of the branch carrying the data set: the workflow validates the tip of that branch,
# which is expected to correspond to the tag of the most recent revision. The files listed for a
# data set are therefore those of its highest revision presently released.
#
# An entry takes two optional keys:
#
#   analysis_files  The analysis files to validate. An entry without them -- an empty entry --
#                   describes a data set that carries no analysis file, and nothing is validated
#                   for it.
#   skip            When true, the data set is recorded but not validated.
#
# datasets.yaml is deliberately not used for this record. It is the public registry, deserialised
# by eos.Datasets into eos.DataSetDescription -- a dataclass that rejects unknown keys -- so adding
# an 'analysis_files' key there would break every already-released EOS that refreshes the registry.

2023-01:
  # highest revision: 2023-01v2
  skip: True
  analysis_files:
    - b-to-u-l-nu.yaml

