posteriors:
  - name: BToeta
    global_options:
      model: CKM
    prior:
      - BToetaFormFactors
    likelihood:
      - BToetaLCSR

  - name: BToeta_BFW
    global_options:
      model: CKM
      form-factors: BFW2010
    prior:
      - BToetaFormFactors_BFW
    likelihood:
      - BToetaLCSR
      - th_bound

  - name: BToeta_prime
    global_options:
      model: CKM
    prior:
      - BToeta_primeFormFactors
    likelihood:
      - BToeta_primeLCSR

  - name: BToetaeta_prime
