  - { title: 'Sample B->pi',      id: 'B-to-pi.sample',        tasks: [ { task: 'sample-nested', arguments: { posterior: 'B-to-pi',     bound: 'multi', sample: 'rwalk', nlive: 400, dlogz: 0.2, miniter: 70000, seed: 202605 } } ] }
