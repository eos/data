posteriors:
  - name: FF-only
    global_options:
      form-factors: BSZ2015
      model: CKM
    fixed_parameters:
      CKM::abs(V_cb): 41.0e-3
    prior:
      - FF
    likelihood:
      - TH-HPQCD

  - name: FF-shape
    global_options:
      form-factors: BSZ2015
      model: CKM
    fixed_parameters:
      CKM::abs(V_cb): 39.0e-3
    prior:
      - FF
    likelihood:
      - EXP-LHCb

  - name: FF-shape-Projection
    global_options:
      form-factors: BSZ2015
      model: CKM
    fixed_parameters:
      CKM::abs(V_cb): 39.0e-3
    prior:
      - FF-Projection
    likelihood:
      - EXP-Projection

  - name: CKM
    global_options:
      form-factors: BSZ2015
      model: CKM
    prior:
      - FF
      - CKM
    likelihood:
      - TH-HPQCD
      - EXP-LHCb

observables:
  B_s->D_s::alpha^f+_1/alpha^f+_0@BSZ2015:
    latex: '\alpha^{f_+}_1 / \alpha^{f_+}_0'
    unit: '1'
    expression: >
      [[B_s->D_s::alpha^f+_1@BSZ2015]] / [[B_s->D_s::alpha^f+_0@BSZ2015]]
  B_s->D_s::alpha^f+_2/alpha^f+_0@BSZ2015:
    latex: '\alpha^{f_+}_2 / \alpha^{f_+}_0'
    unit: '1'
    expression: >
      [[B_s->D_s::alpha^f+_2@BSZ2015]] / [[B_s->D_s::alpha^f+_0@BSZ2015]]

predictions:
  - name: kperp
    global_options:
      form-factors: BSZ2015
      model: CKM
    fixed_parameters:
      CKM::abs(V_cb): 41.0e-3
    observables:
      - name: 'B_s->D_slnu::BR(kperp_min,kperp_max)'
        kinematics:
          - {kperp_min: 0.200, kperp_max: 0.315}
          - {kperp_min: 0.315, kperp_max: 0.430}
          - {kperp_min: 0.430, kperp_max: 0.545}
          - {kperp_min: 0.545, kperp_max: 0.660}
          - {kperp_min: 0.660, kperp_max: 0.775}
          - {kperp_min: 0.775, kperp_max: 0.890}
          - {kperp_min: 0.890, kperp_max: 1.005}
          - {kperp_min: 1.005, kperp_max: 1.120}
          - {kperp_min: 1.120, kperp_max: 1.235}
          - {kperp_min: 1.235, kperp_max: 1.350}
          - {kperp_min: 1.350, kperp_max: 1.465}
          - {kperp_min: 1.465, kperp_max: 1.580}
          - {kperp_min: 1.580, kperp_max: 1.695}
          - {kperp_min: 1.695, kperp_max: 1.810}
          - {kperp_min: 1.810, kperp_max: 1.925}
          - {kperp_min: 1.925, kperp_max: 2.040}
          - {kperp_min: 2.040, kperp_max: 2.155}
          - {kperp_min: 2.155, kperp_max: 2.270}
          - {kperp_min: 2.270, kperp_max: 2.385}
          - {kperp_min: 2.385, kperp_max: 2.500}

  - name: BR
    global_options:
      form-factors: BSZ2015
      model: CKM
    fixed_parameters:
      CKM::abs(V_cb): 41.0e-3
    observables:
      - name: 'B_s->D_slnu::BR(kperp_min,kperp_max)'
        kinematics:
          - {kperp_min: 0.200, kperp_max: 2.500}
      - name: 'B_s->D_slnu::BR'
        kinematics:
          - {q2_min: 0, q2_max: 11.55}

  - name: results
    global_options:
      form-factors: BSZ2015
      model: CKM
    observables:
      - name: 'CKM::abs(V_cb)'
      - name: 'B_s->D_s::alpha^f+_0@BSZ2015'
      - name: 'B_s->D_s::alpha^f+_1/alpha^f+_0@BSZ2015'
      - name: 'B_s->D_s::alpha^f+_2/alpha^f+_0@BSZ2015'

steps:
  - title: sample from FF-only posterior
    id: FF-only.sample
    tasks:
      - task: sample-nested
        arguments:
          posterior: FF-only
          bound: multi
          nlive: 2000
          dlogz: 1.0
          seed: 24
          miniter: 25000

  - title: find mode of FF-only posterior
    id: FF-only.mode
    depends_on:
      FF-only.sample
    tasks:
      - task: find-mode
        arguments:
          posterior: FF-only
          importance_samples: True
          optimizations: 50

  - title: predict kperp distribution
    id: FF-only.predict
    depends_on:
      - FF-only.sample
    tasks:
      - task: predict-observables
        arguments:
          posterior: FF-only
          prediction: kperp

  - title: sample from FF-shape posterior
    id: FF-shape.sample
    tasks:
      - task: sample-nested
        arguments:
          posterior: FF-shape
          bound: multi
          nlive: 200
          dlogz: 1.0
          seed: 24
          miniter: 2500

  - title: predict kperp distribution
    id: FF-shape.predict
    depends_on:
      - FF-shape.sample
    tasks:
      - task: predict-observables
        arguments:
          posterior: FF-shape
          prediction: kperp

  - title: sample from FF-shape-Projection posterior
    id: FF-shape-Projection.sample
    tasks:
      - task: sample-nested
        arguments:
          posterior: FF-shape-Projection
          bound: multi
          nlive: 200
          dlogz: 1.0
          seed: 24
          miniter: 2500

  - title: prediction results for FF-shape-Projection
    id: FF-shape-Projection.predict
    depends_on:
      - FF-shape-Projection.sample
    tasks:
      - task: predict-observables
        arguments:
          posterior: FF-shape-Projection
          prediction: results

  - title: sample from CKM posterior
    id: CKM.sample
    tasks:
      - task: sample-nested
        arguments:
          posterior: CKM
          bound: multi
          nlive: 200
          dlogz: 1.0
          seed: 24

  - title: predict kperp distribution
    id: CKM.predict
    depends_on:
      - CKM.sample
    tasks:
      - task: predict-observables
        arguments:
          posterior: CKM
          prediction: kperp

  - title: Find CKM mode
    id: CKM.mode
    depends_on:
      CKM.sample
    tasks:
      - task: find-mode
        arguments:
          posterior: CKM
          importance_samples: True
          optimizations: 30
