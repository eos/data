    # naturalness caps (_1 in [-10, 10], _2 in [-15, 15]); the narrow charm q^2 range leaves
    # the z^2 coefficients weakly constrained, so most _2 remain at the cap.
    descriptions:
      # vector current
      - { 'parameter': 'Lambda_c->proton::alpha^(0,V)_0@SSE',     'min':    0.49, 'max':    0.89, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(0,V)_1@SSE',     'min':   -3.08, 'max':    1.11, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(0,V)_2@SSE',     'min':  -10.29, 'max':   15.00, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(perp,V)_0@SSE',  'min':    0.84, 'max':    1.59, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(perp,V)_1@SSE',  'min':   -4.66, 'max':    1.84, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(perp,V)_2@SSE',  'min':  -15.00, 'max':   15.00, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(t,V)_1@SSE',     'min':   -2.51, 'max':    1.55, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(t,V)_2@SSE',     'min':   -9.52, 'max':   15.00, 'type': 'uniform' }
      # axial current
      - { 'parameter': 'Lambda_c->proton::alpha^(0,A)_0@SSE',     'min':    0.46, 'max':    0.77, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(0,A)_1@SSE',     'min':   -2.28, 'max':    1.10, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(0,A)_2@SSE',     'min':  -13.46, 'max':   15.00, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(perp,A)_1@SSE',  'min':   -2.58, 'max':    1.41, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(perp,A)_2@SSE',  'min':  -15.00, 'max':   15.00, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(t,A)_1@SSE',     'min':   -3.32, 'max':    1.63, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(t,A)_2@SSE',     'min':  -15.00, 'max':   15.00, 'type': 'uniform' }
      # tensor current
      - { 'parameter': 'Lambda_c->proton::alpha^(0,T)_0@SSE',     'min':    0.61, 'max':    1.47, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(0,T)_1@SSE',     'min':   -4.48, 'max':    2.43, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(0,T)_2@SSE',     'min':  -15.00, 'max':   15.00, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(perp,T)_1@SSE',  'min':   -2.58, 'max':    1.20, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(perp,T)_2@SSE',  'min':  -14.37, 'max':   15.00, 'type': 'uniform' }
      # axial-tensor current
      - { 'parameter': 'Lambda_c->proton::alpha^(0,T5)_1@SSE',    'min':   -3.57, 'max':    2.25, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(0,T5)_2@SSE',    'min':  -15.00, 'max':   15.00, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(perp,T5)_0@SSE', 'min':    0.34, 'max':    0.75, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(perp,T5)_1@SSE', 'min':   -3.55, 'max':    1.89, 'type': 'uniform' }
      - { 'parameter': 'Lambda_c->proton::alpha^(perp,T5)_2@SSE', 'min':  -15.00, 'max':   15.00, 'type': 'uniform' }

  # eta / eta' SSE ranges. MR:2025A supplies 11 correlated pseudo-data points per
  # transition, which constrain the leading (_0) and sub-leading (_1) coefficients
  # only: these ranges are data-driven (mean +- 6 sigma from the first fit, run with
  # the wider ranges _0:2, _1:5, _2:10). The _2 coefficients are NOT constrained --
  # in the first fit their posterior reproduced the prior (posterior/prior width
  # 0.30-0.44 for B -> eta^(') and 0.82-0.98 for D_(s) -> eta^(')), so their range is
  # a pure naturalness statement, capped at _2:5 as for the other light-meson
  # transitions (B -> rho, B -> K^*, B_s -> K^*, B_s -> phi). Predictions above the
  # pseudo-data region (q^2 > 5 GeV^2 for B_(s), q^2 > 0.5 GeV^2 for D_(s)) are
  # extrapolations whose width is set by that cap rather than by MR:2025A.
