metadata:
  title: 'Determination of SSE form factor parameters for EOS v1.1'
  description: >-
    Supplementary material including the analysis file, posterior samples, and figures
    for EOS/ANALYSIS-2026-05, a determination of the SSE form-factor parameters
    that serve as defaults in EOS v1.1.
  id: 2026-05
  authors:
    - name: C. Bolognani
      affiliation: Technische Universität Dortmund
      email: carolina.bolognani@cern.ch
    - name: N. Gubernari
      affiliation: University of Bonn
      email: nicogubernari@gmail.com
    - name: F. Herren
      affiliation: University of Zurich
      email: florian.s.herren@gmail.com
    - name: M. Kirk
      affiliation: Institute for Particle Physics Phenomenology, Durham University
      email: matthew.j.kirk@durham.ac.uk
    - name: M. Reboud
      affiliation: Laboratoire de Physique des 2 Infinis Irène Joliot-Curie
      email: merilreboud@gmail.com
    - name: D. van Dyk
      affiliation: Institute for Particle Physics Phenomenology, Durham University
      email: danny.van.dyk@gmail.com

likelihoods:
  # B -> pi form factors f_+, f_0, f_T
  # Lattice QCD only (LCSR omitted, since lattice covers all three form factors).
  # FLAG:2024A and the parametric constraints are deliberately excluded to avoid
  # double-counting resp. because they are tied to a specific parametrisation.
  - name: B-to-pi
    constraints:
      - 'B->pi::f_++f_0+f_T@FNAL+MILC:2015C'
      - 'B->pi::f_++f_0@RBC+UKQCD:2015A'

  # B -> rho form factors V, A_0, A_1, A_12, T_1, T_2, T_23
  # No lattice QCD exists (the rho is an unstable resonance), so we use the modern
  # LCSR result with full covariance. The older KMO:2006A single-form-factor LCSR
  # (superseded/overlapping) and the parametric constraints are excluded.
  - name: B-to-rho
    constraints:
      - 'B->rho::FormFactors[A_0,A_1,A_2,V,T_1,T_2,T_23]@GKvD:2018A'

  # B -> K form factors f_+, f_0, f_T
  # Lattice QCD covers all three form factors at high q^2. Three statistically
  # independent data sets are combined: FNAL+MILC:2015D, HPQCD:2013A and HPQCD:2022A.
  # The two HPQCD results share a collaboration but not a data set -- HPQCD:2013A uses
  # NRQCD b quarks on the 2+1-flavour MILC asqtad ensembles, HPQCD:2022A a fully
  # relativistic HISQ b on the 2+1+1-flavour MILC HISQ ensembles -- so HPQCD:2013A is
  # NOT superseded in the double-counting sense and is included (reviewer request).
  # The three sets are mutually consistent (combined chi^2/dof = 8.6/18, p = 97%;
  # HPQCD:2013A vs HPQCD:2022A alone 4.8/9, p = 85%), so no PDG rescaling is applied.
  # Caveat: a common collaboration implies shared analysis conventions, so the
  # correlation between the two HPQCD sets is not strictly zero.
  # The FLAG:2021A average is excluded, as it would double-count all of the above.
  - name: B-to-K
    constraints:
      - 'B->K::f_0+f_++f_T@FNAL+MILC:2015D'
      - 'B->K::f_0+f_++f_T@HPQCD:2013A'
      - 'B->K::f_0+f_++f_T@HPQCD:2022A'

  # B -> D^* form factors V, A_0, A_1, A_12, T_1, T_2, T_23
  # Full lattice coverage; three independent collaborations are combined. Older
  # A_1[s_max] points (superseded by these full results) and FLAG/parametric excluded.
  - name: B-to-Dstar
    constraints:
      - 'B->D^*::FormFactors@HPQCD:2023A'
      - 'B->D^*::FormFactors@FNAL+MILC:2021A'
      - 'B->D^*::FormFactors@JLQCD:2023A'

  # B_s -> K form factors f_+, f_0, f_T
  # Lattice (f_+, f_0) from three collaborations are mutually inconsistent; their
  # covariances are rescaled by the PDG factor 11.311 = chi^2/N = 214.9/19, obtained
  # from an exact (the SSE is linear in the alpha) least-squares fit to the three
  # lattice sets alone. NOTE: each set on its own is described essentially perfectly
  # (FNAL+MILC 2.0/8, HPQCD 0.6/6, RBC+UKQCD 0.0/5); the tension is almost entirely
  # between FNAL+MILC:2019A and RBC+UKQCD:2023A (206.9/13 for that pair, versus
  # 10.0/11 for HPQCD + RBC+UKQCD). It is amplified by near-degenerate covariances
  # (max off-diagonal correlation 0.9999 for RBC+UKQCD, 0.9963 for FNAL+MILC), so
  # modest pulls cost a large chi^2. The single PDG factor therefore inflates all
  # three sets to paper over what is really a two-set conflict.
  # f_T (no lattice) is supplemented by GvDV:2020A LCSR.
  - name: Bs-to-K
    constraints:
      - 'B_s->K::f_++f_0@FNAL+MILC:2019A;rescale-factor=11.311'
      - 'B_s->K::f_++f_0@HPQCD:2014A;rescale-factor=11.311'
      - 'B_s->K::f_++f_0@RBC+UKQCD:2023A;rescale-factor=11.311'
      - 'B_s->K::FormFactors[f_+,f_0,f_T]@GvDV:2020A'

  # D -> K form factors f_+, f_0, f_T
  # Full lattice coverage from four collaborations, mutually inconsistent
  # (combined chi^2/N = 68/21); covariances rescaled by the PDG factor 3.241 = chi^2/N.
  - name: D-to-K
    constraints:
      - 'D->K::f_++f_0@ETM:2017B;rescale-factor=3.241'
      - 'D->K::f_T@ETM:2018A;rescale-factor=3.241'
      - 'D->K::f_0+f_++f_T@HPQCD:2022A;rescale-factor=3.241'
      - 'D->K::f_++f_0@FNALMILC:2022A;rescale-factor=3.241'

  # B -> K^* form factors. Lattice (A_1, A_12, V @ HPQCD:2013B) supplemented by
  # GKvD:2018A LCSR for the remaining form factors. Leading + well-measured
  # sub-leading data-constrained; the rest bounded by naturalness (_1:3, _2:5).
  - name: B-to-Kstar
    constraints:
      - 'B->K^*::A_1@HPQCD:2013B'
      - 'B->K^*::A_12@HPQCD:2013B'
      - 'B->K^*::V@HPQCD:2013B'
      - 'B->K^*::FormFactors[A_0,A_1,A_2,V,T_1,T_2,T_23]@GKvD:2018A'

  # B_s -> K^* form factors. Lattice (A_1, A_12, V @ HPQCD:2013B) supplemented by
  # GvDV:2020A LCSR for the remaining form factors.
  - name: Bs-to-Kstar
    constraints:
      - 'B_s->K^*::A_1@HPQCD:2013B'
      - 'B_s->K^*::A_12@HPQCD:2013B'
      - 'B_s->K^*::V@HPQCD:2013B'
      - 'B_s->K^*::FormFactors[A_0,A_1,A_2,V,T_1,T_2,T_23]@GvDV:2020A'

  # B_s -> phi form factors. Lattice (all seven form factors at q^2 = 16, 18.9 GeV^2
  # @ HLMW:2015A, split over two uncorrelated constraints) supplemented by GvDV:2020A
  # LCSR at q^2 <= 5 GeV^2. The two data sets are mutually consistent (chi^2/dof =
  # 0.9/28), so no rescaling is applied. The superseded BSZ:2015A LCSR (both the
  # combined and the per-form-factor variants) and the parametric constraints
  # (BSZ:2015A, GvDV:2020A, GRvDV:2023A) are excluded.
  - name: Bs-to-phi
    constraints:
      - 'B_s->phi::V+A_0+A_1+A_12@HLMW:2015A'
      - 'B_s->phi::T_1+T_2+T_23@HLMW:2015A'
      - 'B_s->phi::FormFactors[A_0,A_1,A_2,V,T_1,T_2,T_23]@GvDV:2020A'

  # B_s -> D_s^* form factors. Lattice only (HPQCD:2023A, 24 observations); no LCSR
  # available. The SSE uses 17 coefficients (orders 0,1,2); leading + well-measured
  # sub-leading are data-constrained, the rest bounded by naturalness (_1:12, _2:15).
  # The DB additionally carries spurious A12_0, T2_0 (EOM) and order-3 (_3) SSE
  # parameters that the order-2 SSE code ignores; these are not varied.
  - name: Bs-to-Dsstar
    constraints:
      - 'B_s->D_s^*::FormFactors@HPQCD:2023A'

  # B_c -> J/psi form factors. Lattice only (HPQCD:2025A, 24 observations).
  # NOTE: the SSE gives a POOR fit here (chi^2 ~ 26/5 dof, p ~ 0.01%); SSE does not
  # describe this channel well. 17 SSE coefficients (orders 0,1,2); A12_0, T2_0 (q^2 = 0
  # relations), A1_0, T23_0 (endpoint relations) and order-3 parameters are not varied.
  - name: Bc-to-Jpsi
    constraints:
      - 'B_c->J/psi::FormFactors@HPQCD:2025A'

  # B -> D form factors f_+, f_0 (b->c). f_T is OMITTED: there is no lattice or LCSR
  # tensor input for this pseudoscalar transition, so its coefficients are not varied.
  # Lattice QCD f_+, f_0 from two independent collaborations (FNAL+MILC:2015B, HPQCD:2015A);
  # the superseded single-point f_+(0) sum-rule value FKKM:2008A is excluded.
  - name: B-to-D
    constraints:
      - 'B->D::f_++f_0@FNAL+MILC:2015B'
      - 'B->D::f_++f_0@HPQCD:2015A'

  # B_s -> D_s form factors f_+, f_0 (b->c). f_T likewise omitted (no tensor input).
  # Lattice QCD f_+, f_0 from HPQCD:2019A.
  - name: Bs-to-Ds
    constraints:
      - 'B_s->D_s::f_++f_0@HPQCD:2019A'

  # Lambda_b -> Lambda form factors (1/2^+ -> 1/2^+); full set V + A + T + T5.
  # Lattice QCD only: the Detmold-Meinel synthetic form-factor data (nominal z-fit,
  # no-prior variant) covers all ten form factors. The parametric a_N@DM2016 variant
  # (tied to a specific parametrisation), the [HO,no-prior] systematic variant (would
  # double-count) and the BFvD:2014A LCSR (superseded) are all excluded.
  - name: Lambdab-to-Lambda
    constraints:
      - 'Lambda_b->Lambda::f_time+long+perp^V+A+T+T5[nominal,no-prior]@DM:2016A'

  # Lambda_b -> Lambda_c form factors (1/2^+ -> 1/2^+); full set V + A + T + T5.
  # Lattice QCD only. EOS ships DKMR:2017A as a constraint on the DKMR2017 z-expansion
  # coefficients, which carries no dependence on the SSE coefficients; the manual constraint
  # below is its pushforward onto the form factors themselves, one q^2 point per free DKMR2017
  # coefficient, so the covariance stays regular and no information is lost. See
  # scripts/generate-lambdab-to-lambdac.py.
  - name: Lambdab-to-Lambdac
    manual_constraints:
      'Lambda_b->Lambda_c::f_time+long+perp^V+A+T+T5@DKMR:2017A':
        type: 'MultivariateGaussian(Covariance)'
        observables: [ 'Lambda_b->Lambda_c::f_long^V(q2)', 'Lambda_b->Lambda_c::f_long^V(q2)', 'Lambda_b->Lambda_c::f_time^V(q2)', 'Lambda_b->Lambda_c::f_time^V(q2)', 'Lambda_b->Lambda_c::f_perp^V(q2)', 'Lambda_b->Lambda_c::f_perp^V(q2)', 'Lambda_b->Lambda_c::f_long^A(q2)', 'Lambda_b->Lambda_c::f_long^A(q2)', 'Lambda_b->Lambda_c::f_time^A(q2)', 'Lambda_b->Lambda_c::f_time^A(q2)', 'Lambda_b->Lambda_c::f_perp^A(q2)', 'Lambda_b->Lambda_c::f_long^T(q2)', 'Lambda_b->Lambda_c::f_long^T(q2)', 'Lambda_b->Lambda_c::f_perp^T(q2)', 'Lambda_b->Lambda_c::f_perp^T(q2)', 'Lambda_b->Lambda_c::f_long^T5(q2)', 'Lambda_b->Lambda_c::f_long^T5(q2)', 'Lambda_b->Lambda_c::f_perp^T5(q2)' ]
        kinematics:  [ { q2:   1.0 }, { q2:  10.0 }, { q2:   1.0 }, { q2:  10.0 }, { q2:   1.0 }, { q2:  10.0 }, { q2:   1.0 }, { q2:  10.0 }, { q2:   1.0 }, { q2:  10.0 }, { q2:  10.0 }, { q2:   1.0 }, { q2:  10.0 }, { q2:   1.0 }, { q2:  10.0 }, { q2:   1.0 }, { q2:  10.0 }, { q2:  10.0 } ]
        options:     [ {}, {}, {}, {}, {}, {}, {}, {}, {}, {}, {}, {}, {}, {}, {}, {}, {}, {} ]
        means:       [ +0.460336688, +1.024004657, +0.452822977, +0.907397434, +0.614231958, +1.355957445, +0.410759182, +0.831284146, +0.417223852, +0.934997439, +0.830960086, +0.579007550, +1.230447371, +0.389774150, +0.885296576, +0.398521986, +0.816044130, +0.815434299 ]
        covariance: [ [ +1.073669694863e-03, -2.841962884657e-05, +1.049289334912e-03, -5.444357874932e-05, +8.032884288154e-04, -2.844614541562e-05, +2.833086436585e-04, -2.969212287610e-05, +2.980455008446e-04, +3.563840188630e-06, -3.515416085282e-05, +8.825163052896e-04, -6.116429632498e-05, +4.623442780844e-04, -4.358439118237e-05, +1.928991429132e-04, -2.749934411078e-05, -2.629929685084e-05 ],
