    unit: '1'
    options: {}
    expression: "<<B_c->J/psilnu::Gamma;l=mu>>[q2_min=0.0112,q2_max=10.10] / <<B->Dlnu::Gamma;l=mu,q=d>>[q2_min=0.0112,q2_max=11.62]"
