      - { 'parameter': 'B->eta_prime::alpha^fT_1@SSE', 'min':  -4.06, 'max':   3.19, 'type': 'uniform' }
      - { 'parameter': 'B->eta_prime::alpha^fT_2@SSE', 'min':  -5.00, 'max':   5.00, 'type': 'uniform' }
  - name: Bs-to-eta
    descriptions:
