    # lattice inputs and truncated the posterior badly -- they bounded f+_1 at -0.70
    # and f+_2 at 0.98, whereas the data prefer -0.710 +- 0.043 and 0.648 +- 0.154,
    # which pinned both coefficients against the box and drove the p value to 0.
    # f_T has no lattice input: its leading coefficient is weakly constrained by the
    # GvDV LCSR and the sub-leading ones remain naturalness-capped.
    descriptions:
      - { 'parameter': 'B_s->K::alpha^f+_0@SSE', 'min':    0.26, 'max':    0.55, 'type': 'uniform' }
      - { 'parameter': 'B_s->K::alpha^f+_1@SSE', 'min':   -0.97, 'max':   -0.45, 'type': 'uniform' }
