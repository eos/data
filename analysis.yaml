    latex: $\frac{\Gamma(B_s^0\to D_s^{*-}\mu^+\nu_\mu)}{\Gamma(B^0\to D^{*-}\mu^+\nu_\mu)}$
    unit: '1'
    options: {}
    expression: "<<B_s->D_s^*lnu::Gamma;l=mu>>[q2_min=0.0112,q2_max=10.59] / <<B->D^*lnu::Gamma;l=mu,q=d>>[q2_min=0.0112,q2_max=10.68]"
