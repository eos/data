  # Lambda_c -> Lambda form factors (1/2^+ -> 1/2^+); vector + axial only.
  # Lattice QCD only: the Meinel synthetic form-factor data covers the six V + A
  # form factors. There is no (lattice or LCSR) tensor input, so the tensor SSE
  # coefficients are not varied. The parametric a_N@DM2016 variant is excluded.
  - name: Lambdac-to-Lambda
    constraints:
      - 'Lambda_c->Lambda::f_time+long+perp^V+A@M:2016A'

  # Lambda_c -> neutron form factors (1/2^+ -> 1/2^+); full set V + A + T + T5.
  # The c -> d charged-current nucleon transition (Meinel's Lambda_c -> N lattice QCD).
  # Lattice QCD only: the M:2017A synthetic form-factor data (higher-order "HO" z-fit)
  # covers all ten form factors. The [nominal] variant is excluded (would double-count).
  - name: Lambdac-to-neutron
    constraints:
      - 'Lambda_c->neutron::f_time+long+perp^V+A+T+T5[HO]@M:2017A'

  # Lambda_c -> proton form factors (1/2^+ -> 1/2^+); full set V + A + T + T5.
  # The c -> u transition; a DIFFERENT process from Lambda_c -> neutron. Lattice QCD only:
  # the M:2017A synthetic form-factor data (higher-order "HO" z-fit) covers all ten form
  # factors. The [nominal] variant is excluded (would double-count).
  - name: Lambdac-to-proton
    constraints:
      - 'Lambda_c->proton::f_time+long+perp^V+A+T+T5[HO]@M:2017A'

  # eta and eta' form factors. MR:2025A supplies 11 correlated synthetic values
  # for f_+, f_0, and f_T per transition; no rate constraints are included here.
  # NOTE: the SSE SATURATES these pseudo-data. At the mode every one of the eight
  # channels returns chi^2 between 1e-4 (B -> eta^prime) and 1.4e-1 (D_s -> eta^prime)
  # for 11 observations and 8 varied coefficients (3 dof), so the reported p-value
  # of 100% carries NO information and must not be read as validation of the SSE
  # here. Two causes: MR:2025A derives its synthetic values from a parametrisation
  # that the order-2 SSE reproduces almost exactly, and the strongly correlated
  # covariance leaves few effective constraints. The informative checks for these
  # channels are the prior sensitivity of the _2 coefficients (see the priors
  # section) and the size of the extrapolation beyond the pseudo-data region.
  - name: B-to-eta
    constraints: [ 'B->eta::f_0+f_++f_T@MR:2025A' ]
  - name: B-to-etaprime
    constraints: [ 'B->eta_prime::f_0+f_++f_T@MR:2025A' ]
  - name: Bs-to-eta
    constraints: [ 'B_s->eta::f_0+f_++f_T@MR:2025A' ]
  - name: Bs-to-etaprime
    constraints: [ 'B_s->eta_prime::f_0+f_++f_T@MR:2025A' ]
  - name: D-to-eta
    constraints: [ 'D->eta::f_0+f_++f_T@MR:2025A' ]
  - name: D-to-etaprime
    constraints: [ 'D->eta_prime::f_0+f_++f_T@MR:2025A' ]
  - name: Ds-to-eta
    constraints: [ 'D_s->eta::f_0+f_++f_T@MR:2025A' ]
  - name: Ds-to-etaprime
    constraints: [ 'D_s->eta_prime::f_0+f_++f_T@MR:2025A' ]

priors:
  - name: B-to-pi
    descriptions:
      - { 'parameter': 'B->pi::alpha^f+_0@SSE', 'min':  0.32, 'max':  0.48, 'type': 'uniform' }
      - { 'parameter': 'B->pi::alpha^f+_1@SSE', 'min': -1.10, 'max': -0.30, 'type': 'uniform' }
      - { 'parameter': 'B->pi::alpha^f+_2@SSE', 'min': -1.50, 'max':  0.50, 'type': 'uniform' }
      - { 'parameter': 'B->pi::alpha^f0_1@SSE', 'min': -0.15, 'max':  0.20, 'type': 'uniform' }
      - { 'parameter': 'B->pi::alpha^f0_2@SSE', 'min': -0.70, 'max':  0.00, 'type': 'uniform' }
      - { 'parameter': 'B->pi::alpha^fT_0@SSE', 'min':  0.29, 'max':  0.49, 'type': 'uniform' }
      - { 'parameter': 'B->pi::alpha^fT_1@SSE', 'min': -1.45, 'max':  0.05, 'type': 'uniform' }
      - { 'parameter': 'B->pi::alpha^fT_2@SSE', 'min': -1.90, 'max':  0.60, 'type': 'uniform' }

  # P -> V note: alpha^A1_0 and alpha^T23_0 are NOT varied. Besides the two q^2 = 0
  # relations (which remove alpha^A12_0 and alpha^T2_0), the SSE now imposes the two
  # endpoint relations A_12(t_-) = R A_1(t_-) and T_23(t_-) = K T_2(t_-), with
  # R = (m_B^2 - m_V^2)/(8 m_B m_V) and K = (m_B + m_V)^2/(4 m_B m_V). These fix the
  # leading coefficients of A_1 and T_23, and make the derived A_2 and T_3 finite at
  # the endpoint. 17 coefficients are varied per P -> V channel, not 19.
  - name: B-to-rho
    # Leading coefficients (_0) are data-constrained (posterior mean +- ~6 sigma).
    # The GKvD LCSR data does not constrain the sub-leading coefficients, so these
    # are bounded by naturalness: _1 in [-3, 3], _2 in [-5, 5].
    descriptions:
      - { 'parameter': 'B->rho::alpha^V_0@SSE',   'min': -0.94, 'max': 1.55, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^V_1@SSE',   'min': -3.00, 'max':  3.00, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^V_2@SSE',   'min': -5.00, 'max':  5.00, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^A0_0@SSE',  'min': -0.53, 'max': 1.24, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^A0_1@SSE',  'min': -3.00, 'max':  3.00, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^A0_2@SSE',  'min': -5.00, 'max':  5.00, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^A1_1@SSE',  'min': -3.00, 'max':  3.00, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^A1_2@SSE',  'min': -5.00, 'max':  5.00, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^A12_1@SSE', 'min': -3.00, 'max':  3.00, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^A12_2@SSE', 'min': -5.00, 'max':  5.00, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^T1_0@SSE',  'min': -0.81, 'max': 1.34, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^T1_1@SSE',  'min': -3.00, 'max':  3.00, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^T1_2@SSE',  'min': -5.00, 'max':  5.00, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^T2_1@SSE',  'min': -3.00, 'max':  3.00, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^T2_2@SSE',  'min': -5.00, 'max':  5.00, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^T23_1@SSE', 'min': -3.00, 'max':  3.00, 'type': 'uniform' }
      - { 'parameter': 'B->rho::alpha^T23_2@SSE', 'min': -5.00, 'max':  5.00, 'type': 'uniform' }

  - name: B-to-K
    # All coefficients well determined by high-q^2 lattice; ranges are posterior mean +- ~6 sigma.
    descriptions:
      - { 'parameter': 'B->K::alpha^f+_0@SSE', 'min':  0.42, 'max':  0.51, 'type': 'uniform' }
      - { 'parameter': 'B->K::alpha^f+_1@SSE', 'min': -1.22, 'max': -0.55, 'type': 'uniform' }
      - { 'parameter': 'B->K::alpha^f+_2@SSE', 'min': -0.86, 'max':  0.26, 'type': 'uniform' }
      - { 'parameter': 'B->K::alpha^f0_1@SSE', 'min':  0.09, 'max':  0.58, 'type': 'uniform' }
      - { 'parameter': 'B->K::alpha^f0_2@SSE', 'min': -0.91, 'max':  0.93, 'type': 'uniform' }
      - { 'parameter': 'B->K::alpha^fT_0@SSE', 'min':  0.41, 'max':  0.53, 'type': 'uniform' }
      - { 'parameter': 'B->K::alpha^fT_1@SSE', 'min': -1.49, 'max': -0.38, 'type': 'uniform' }
      - { 'parameter': 'B->K::alpha^fT_2@SSE', 'min': -2.52, 'max':  1.65, 'type': 'uniform' }

  - name: B-to-Dstar
    # Leading coefficients data-tightened (mean +- 6 sigma). Sub-leading clamped to
    # naturalness caps (_1 in [-12,12], _2 in [-15,15]); the clamp only bounds the
    # weakly-constrained/degenerate directions and preserves all data-driven values.
    descriptions:
      - { 'parameter': 'B->D^*::alpha^A0_0@SSE',  'min': 0.53, 'max': 0.81, 'type': 'uniform' }
      - { 'parameter': 'B->D^*::alpha^A0_1@SSE',  'min': -7.67, 'max': 0.4, 'type': 'uniform' }
      - { 'parameter': 'B->D^*::alpha^A0_2@SSE',  'min': -15.00, 'max':  15.00, 'type': 'uniform' }
      - { 'parameter': 'B->D^*::alpha^A1_1@SSE',  'min': -3.04, 'max': 2.83, 'type': 'uniform' }
      - { 'parameter': 'B->D^*::alpha^A1_2@SSE',  'min': -15.00, 'max':  15.00, 'type': 'uniform' }
      - { 'parameter': 'B->D^*::alpha^A12_1@SSE', 'min': -1.42, 'max': 0.88, 'type': 'uniform' }
      - { 'parameter': 'B->D^*::alpha^A12_2@SSE', 'min': -15.00, 'max':  15.00, 'type': 'uniform' }
      - { 'parameter': 'B->D^*::alpha^V_0@SSE',   'min': 0.64, 'max': 1.06, 'type': 'uniform' }
      - { 'parameter': 'B->D^*::alpha^V_1@SSE',   'min': -10.18, 'max': 0.9, 'type': 'uniform' }
      - { 'parameter': 'B->D^*::alpha^V_2@SSE',   'min': -15.00, 'max':  15.00, 'type': 'uniform' }
      - { 'parameter': 'B->D^*::alpha^T1_0@SSE',  'min': 0.53, 'max': 0.92, 'type': 'uniform' }
      - { 'parameter': 'B->D^*::alpha^T1_1@SSE',  'min': -9.75, 'max': 3.14, 'type': 'uniform' }
      - { 'parameter': 'B->D^*::alpha^T1_2@SSE',  'min': -15.00, 'max':  15.00, 'type': 'uniform' }
      - { 'parameter': 'B->D^*::alpha^T2_1@SSE',  'min': -5.36, 'max': 4.82, 'type': 'uniform' }
      # T2_2 is bounded by naturalness, not by data: released to +-50 it returns
      # -8.73 +- 10.27 (sd/sd_uniform = 0.36), i.e. still prior-dominated. The mild
      # asymmetry seen against the cap (7% of the weight in the lowest 5% of the
      # range, 1% in the highest) is a preference for negative values within the
      # naturalness range, not a hard truncation; mean +- 6 sigma would demand
      # [-70, +53], which is not a natural size for a z-expansion coefficient.
      # The b->c cap of 15 is therefore kept.
      - { 'parameter': 'B->D^*::alpha^T2_2@SSE',  'min': -15.00, 'max':  15.00, 'type': 'uniform' }
      - { 'parameter': 'B->D^*::alpha^T23_1@SSE', 'min': -12.35, 'max': 10.28, 'type': 'uniform' }
      - { 'parameter': 'B->D^*::alpha^T23_2@SSE', 'min': -15.00, 'max':  15.00, 'type': 'uniform' }

  - name: Bs-to-K
    # Re-derived from a first fit run with wide ranges (_0:2, _1:12, _2:15) under the
    # updated rescale factor 11.311: mean +- 6 sigma, clamped to the naturalness caps
