    prior:
      - BsToeta_primeFormFactors
    likelihood:
      - BsToeta_primeLCSR

  - name: BsToetas
    global_options:
      model: CKM
    fixed_parameters:
      'mass::eta_prime': 0.6885
      'mass::eta_prime@BSZ2015': 0.6885
    prior:
      - BsToetasFormFactors
    likelihood:
      - BsToetasLCSR

  - name: BsToetasLQCD
    global_options:
      model: CKM
    fixed_parameters:
      'mass::eta_prime': 0.6885
