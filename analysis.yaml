    likelihood:
      - DsToetaLCSR

  - name: DsToeta_prime
    global_options:
      model: CKM
    prior:
      - DsToeta_primeFormFactors
    likelihood:
      - DsToeta_primeLCSR

  - name: DsToetaeta_prime
    global_options:
      model: CKM
    prior:
      - DsToetaFormFactors
      - DsToeta_primeFormFactors
    likelihood:
      - DsToetaeta_primeLCSR

  - name: BToetalnu
    global_options:
      model: CKM
    prior:
      - BToetaFormFactors
      - Vub
    likelihood:
      - BToetaLCSR
      - BToetaExp

  - name: DToetalnu
    global_options:
      model: CKM
    prior:
      - DToetaFormFactors
      - Vcd
    likelihood:
      - DToetaLCSR
      - DToetaExp

