    unit: '1'
    options: {}
    expression: "<<B_s->D_slnu::Gamma;l=mu>>[q2_min=0.0112,q2_max=11.55] / <<B->Dlnu::Gamma;l=mu,q=d>>[q2_min=0.0112,q2_max=11.62]"
