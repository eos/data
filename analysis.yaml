observables:
  'Lambda_c->protonll::BR1/BR2':
    latex: '\frac{\mathcal{B}_{[q2min1,q2max1]}}{\mathcal{B}_{[q2min2,q2max2]}}(\Lambda_c\to p \mu^+\mu^-)'
    unit: '1'
    options: {l : mu, form-factors: BMRvD2022}
    expression:
      '<<Lambda_c->protonll::BR>>[q2_min=>q2_1_min,q2_max=>q2_1_max]/<<Lambda_c->protonll::BR>>[q2_min=>q2_2_min,q2_max=>q2_2_max]'
  'Lambda_c->protonll::BR1+BR2':
    latex: '\mathcal{B}_{[q2min1,q2max1]}(\Lambda_c\to p \mu^+\mu^-) + \mathcal{B}_{[q2min2,q2max2]} (\Lambda_c\to p \mu^+\mu^-)'
    unit: '1'
    options: {l : mu, form-factors: BMRvD2022}
    expression:
      '<<Lambda_c->protonll::BR>>[q2_min=>q2_1_min,q2_max=>q2_1_max]+<<Lambda_c->protonll::BR>>[q2_min=>q2_2_min,q2_max=>q2_2_max]'
  'Lambda_c->protonll::(BR1+BR2)/BR3':
    latex: 'frac{\mathcal{B}_{[q2min1,q2max1]}+\mathcal{B}_{[q2min2,q2max2]}}{\mathcal{B}_{[q2min3,q2max3]}}(\Lambda_c\to p \mu^+\mu^-)'
    unit: '1'
    options: {l : mu, form-factors: BMRvD2022}
    expression:
      '(<<Lambda_c->protonll::BR>>[q2_min=>q2_1_min,q2_max=>q2_1_max]+<<Lambda_c->protonll::BR>>[q2_min=>q2_2_min,q2_max=>q2_2_max])/<<Lambda_c->protonll::BR>>[q2_min=>q2_3_min,q2_max=>q2_3_max]'
  'Lambda_c->protonll::F_L(bin1+bin2)':
    latex: '\langle \mathcal{F}_L \rangle_{a+b}'
    unit: '1'
    options: {}
    expression: '(<<Lambda_c->protonll::F_L_numerator>>[q2_min=>q2_1_min,q2_max=>q2_1_max]+<<Lambda_c->protonll::F_L_numerator>>[q2_min=>q2_2_min,q2_max=>q2_2_max])/(<<Lambda_c->protonll::Gamma>>[q2_min=>q2_1_min,q2_max=>q2_1_max] + <<Lambda_c->protonll::Gamma>>[q2_min=>q2_2_min,q2_max=>q2_2_max])'
  'Lambda_c->protonll::binAFB(q2)':
    latex: '\langle A_{\mathrm{FB}}\rangle(q^2)'
    unit: '1'
    options: {}
    expression: '([[QM::hbar]] / [[life_time::Lambda_c]])  * (<<Lambda_c->protonll::A_FB^l(q2)>> * <<Lambda_c->protonll::dBR/dq2>>) / <<Lambda_c->protonll::Gamma>>[q2_min=0.959,q2_max=1.122]'

