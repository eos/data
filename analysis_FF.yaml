steps:
  - title: 'Sample from FF_2_2_3_3 posterior'
    id: 'FF_2_2_3_3.sample'
    tasks:
      - task: 'sample-nested'
        arguments:
          posterior: 'FF_2_2_3_3'
          sampling-method: 'rwalk'
          nlive: 500
  - title: 'Produce corner plot for FF_2_2_3_3 posterior'
    id: 'FF_2_2_3_3.corner-plot'
    depends_on:
      - 'FF_2_2_3_3.sample'
    tasks:
      - task: 'corner-plot'
        arguments:
          posterior: 'FF_2_2_3_3'
  - title: 'Find mode from FF_2_2_3_3 posterior'
    id: 'FF_2_2_3_3.find-mode'
    depends_on:
      - 'FF_2_2_3_3.sample'
    tasks:
      - task: 'find-mode'
        arguments:
          posterior: 'FF_2_2_3_3'
          from-samples: true
          optimizations: 10
  - title: 'Predict observables from FF_2_2_3_3 posterior'
    id: 'FF_2_2_3_3.predict-observables'
    depends_on:
      - 'FF_2_2_3_3.sample'
    tasks:
      - task: 'predict-observables'
        arguments:
          posterior: 'FF_2_2_3_3'
          prediction: 'tau-P'
      - task: 'predict-observables'
        arguments:
          posterior: 'FF_2_2_3_3'
          prediction: 'fp_at_0'
      - task: 'predict-observables'
        arguments:
          posterior: 'FF_2_2_3_3'
          prediction: 'quadratic_model_parameters'
      - task: 'predict-observables'
        arguments:
          posterior: 'FF_2_2_3_3'
